[package]
name = "unatrare_salute_burn"
version = "0.1.0"
description = "UNATRARE on-chain salute burn program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "unatrare_salute_burn"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true, features = ["token_2022"] }
