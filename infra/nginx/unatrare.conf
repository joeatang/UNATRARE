proxy_cache_path /var/cache/nginx/unatrare
    levels=1:2
    keys_zone=unatrare_art:10m
    max_size=2g
    inactive=365d
    use_temp_path=off;

server {
    server_name unatrare.wtf www.unatrare.wtf;
    client_max_body_size 30M;  # 25MB vault uploads + headroom

    # Static uploads — served directly from disk, bypassing Node.js.
    #
    # WHY THIS BLOCK EXISTS (and must not be removed):
    #   Next.js in production scans public/ at startup and builds a static
    #   file manifest. Any directory created dynamically at runtime (e.g.
    #   public/uploads/vault/ on the first vault upload) is invisible to
    #   Next.js — requests to those files return 404 from Node.js.
    #   Serving /uploads/ at the nginx layer completely sidesteps this:
    #   nginx reads from disk directly, no Node.js involvement.
    #
    # Deploy note: this block must exist in nginx config or vault uploads 404.
    location /uploads/ {
        alias /var/www/unatrare/public/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Art files — nginx-level cache (immutable, content-addressed by SHA-256 hash).
    # First request hits Node.js once; every subsequent request served from nginx
    # cache (~5ms). Year-long TTL is safe: hashes never collide.
    location ~ ^/art/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache unatrare_art;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else — proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/unatrare.wtf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unatrare.wtf/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.unatrare.wtf) { return 301 https://$host$request_uri; }
    if ($host = unatrare.wtf)     { return 301 https://$host$request_uri; }
    listen 80;
    server_name unatrare.wtf www.unatrare.wtf;
    return 404;
}
