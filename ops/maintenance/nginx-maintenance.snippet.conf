# Maintenance-mode additions for the live nginx server block.
#
# This is a REFERENCE copy. The live config lives on the host at
#   /etc/nginx/sites-enabled/unatrare
# The real bypass secret is only stored on the host (never in git).
#
# Three changes to the `server { ... }` block that serves unatrare.wtf:
#
# ── 1. Inside `location / { ... }`, BEFORE `proxy_pass`, add the gate: ──────────
#
#     set $maint 0;
#     if (-f /var/www/unatrare/MAINTENANCE)      { set $maint 1; }
#     if ($cookie_unat_bypass = "REPLACE_SECRET") { set $maint 0; }   # operator bypass
#     if ($maint = 1) { return 503; }
#
#   NOTE: /art/ and /uploads/ are SEPARATE location blocks and are intentionally
#   NOT gated — certified art must keep serving to wallets during maintenance.
#
# ── 2. Add an unlock endpoint so the operator can browse while closed: ─────────
#
#     location = /__unlock {
#         add_header Set-Cookie "unat_bypass=REPLACE_SECRET; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax" always;
#         return 302 https://unatrare.wtf/;
#     }
#
# ── 3. Point 503 at the friendly page (keeps the 503 status for crawlers): ─────
#
#     error_page 503 @maintenance;
#     location @maintenance {
#         root /var/www/unatrare/ops/maintenance;
#         rewrite ^ /maintenance.html break;
#         add_header Retry-After 600 always;
#         add_header Cache-Control "no-store" always;
#     }
#
# Toggling maintenance does NOT require an nginx reload — the flag file is checked
# per request. Only these config lines require a one-time `nginx -t && systemctl reload nginx`.
